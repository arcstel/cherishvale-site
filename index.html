<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/logo/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/logo/apple-touch-icon.png">
<link rel="canonical" href="https://cherishvale.com/">
<title>Cherishvale</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#0c0f12 url("/assets/backdrop.jpg") center center / cover no-repeat fixed;
    color:#e9eef0;
  }
  main{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px;
    gap:22px;
    user-select:none;
  }
  .mark{
    width:clamp(140px,22vw,240px);
    height:auto;
    display:block;
    filter:drop-shadow(0 12px 36px rgba(0,0,0,.65));
  }
  .wordmark{
    width:clamp(210px,36vw,380px);
    height:auto;
    display:block;
    filter:drop-shadow(0 8px 28px rgba(0,0,0,.65));
  }
</style>
</head>
<body>
<main aria-label="Cherishvale">
  <img class="mark" src="/assets/logo/mark-transparent.png" alt="">
  <img class="wordmark" src="/assets/logo/wordmark-transparent.png" alt="Cherishvale">
</main>
</body>
</html>
